name: 'Alarm ob napaki CI'
description: >-
  Dead-man alarm (audit okt-2026 #16): ob odpovedi joba odpre (ali dopolni)
  GitHub issue z labelom ci-alarm in dodeli lastniku. Brez tega koraka je
  rdeč pipeline tiho — pet dni izpadlega backupa (13.–18. 10.) nihče ni
  opazil, ker noben workflow ni imel `if: failure()`.

# Zakaj issue in ne e-pošta/slack: repozitorij nima nobenega messaging
# secret-a (edini referencirani so NEON_API_KEY_B64, VERCEL_*, GITLAB_*).
# Issue z dodelitvijo sproži GitHub obvestilo na račun, ki ga lastnik že
# bere — brez novega zunanjega sistema in brez novega secret-a.
#
# Sam korak NIKOLI ne vrne napake (job je že rdeč); sicer bi alarm zakril
# pravi vzrok odpovedi v logu.
#
# ── v1.168.0: alarm do zdaj NI nikoli dostopil ──────────────────────────────
# 6 zaporednih canary odpovedi (16.–22. 10.) je vrnilo `success` z
# `state=spodletela` in niti ene `[CI alarm]` issue. Tri lastne napake:
#  1. `API="${{ github.server_url }}/api/v3/..."` — ta pot vrne 404 (izmerjeno);
#     pravilen REST base je `github.api_url` (= https://api.github.com). Ker
#     `api()` uporablja `curl -f`, je PADSLO vsak poziv, ne samo eden.
#  2. `${{ inputs.hint }}` se v shell besedilo presedeke dobesedno, hint pa
#     ima narekovaje → `line 5: [: too many arguments` (run 39742241206) in
#     navodilo "najprej preveri" je izginilo iz povzetka in issue.
#  3. JSON so gradili `python3 -c` pozivi; na Windows runnerjih je python3
#     stub, ki izpiše napako in vrne 0 → tiho prazen payload.
# Zato gre VSAKA zunanja vrednost prek `env:` (skript je s tem izvedljiv
# lokalno, kar dokazuje tests/v168-ci-alarm-delivery.test.ts), REST base je
# `github.api_url`, JSON pa gradi izključno `node`.

inputs:
  token:
    description: 'GITHUB_TOKEN (zahteva permissions: issues: write)'
    required: true
  scope:
    description: 'Kaj job počne (npr. "backup produkcijske baze")'
    required: true
  hint:
    description: 'Kaj preveriti najprej (potencialni vzrok)'
    required: false
    default: ''

outputs:
  alarm:
    description: 'odprta | dopolnjena | spodletela'
    value: ${{ steps.alarm.outputs.state }}

runs:
  using: composite
  steps:
    - name: 'Povzetek koraka (veden takoj, tudi brez API-ja)'
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        HINT: ${{ inputs.hint }}
        JOB: ${{ github.job }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -u
        {
          echo "## :rotating_light: CI alarm — $SCOPE"
          echo ""
          echo "- **workflow:** \`$GITHUB_WORKFLOW\`"
          echo "- **job:** \`$JOB\`"
          echo "- **run:** [#$GITHUB_RUN_NUMBER]($SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) (poskus $GITHUB_RUN_ATTEMPT)"
          echo "- **branch:** \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`"
          echo "- **sprožil:** \`$GITHUB_ACTOR\`"
          if [ -n "$HINT" ]; then
            echo "- **najprej preveri:** $HINT"
          fi
          echo ""
          echo "Odgovoren je korak z oznako **Alarm ob napaki CI**; v logu je zgoraj pravi vzrok odpovedi."
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::error::$SCOPE je odpovedal — issue alarm je poskus"

    - name: 'Odprej ali dopolni issue s tremi vztrajnimi poskusi'
      id: alarm
      env:
        SCOPE: ${{ inputs.scope }}
        HINT: ${{ inputs.hint }}
        JOB: ${{ github.job }}
        API_BASE: ${{ github.api_url }}
        SERVER_URL: ${{ github.server_url }}
        TOKEN: ${{ inputs.token }}
      shell: bash
      run: |
        set -u
        # Buildkite pri uvozu GHA recepta zavrne izraza `runner.name`/`runner.os`
        # ("Unsupported runtime expression"). GitHub ta podatka že sama izpostavi
        # kot `RUNNER_NAME`/`RUNNER_OS`, zato ju beremo iz okolja; privzetek krije
        # vsak drugi runner (npr. GitLab), kjer teh spremenljivk ni.
        RUNNER_NAME="${RUNNER_NAME:-GitHub Actions}"
        RUNNER_OS="${RUNNER_OS:-unknown}"
        API="${API_BASE}/repos/${GITHUB_REPOSITORY}"
        TITLE="[CI alarm] $GITHUB_WORKFLOW — $SCOPE"
        # Body živi v spremenljivki, ne v začasni datoteki: mktemp je dodatna
        # točka, ki lahko tiho odpove, brez datoteke pa je payload preverljiv
        # tudi zunaj runnerja (tests/v168-ci-alarm-delivery.test.ts).
        BODY=$(cat <<EOF
        Job \`$JOB\` v workflowu **$GITHUB_WORKFLOW** je odpovedal.

        - **run:** [#$GITHUB_RUN_NUMBER]($SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) (poskus $GITHUB_RUN_ATTEMPT)
        - **branch:** \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`
        - **sprožil:** \`$GITHUB_ACTOR\` · **runner:** \`$RUNNER_NAME\` ($RUNNER_OS)
        ${HINT:+- **najprej preveri:** $HINT}

        Issue namenoma NE vsebuje izsečka loga — vsebuje lahko zneske, davčne
        podatke in kratke odtise skrivnosti (audit okt-2026 #20). Podrobnosti so
        samo v run-u, dostopnem zgoraj.

        Ta issue je dedupliciran: nadaljnje odpovedi istega workflowa se pripnejo
        kot komentar, da alarm ne utone v hrup.
        EOF
        )

        SLEEP="${API_RETRY_SLEEP:-3}"
        api() { # method endpoint [data_json]
          local method="$1" ep="$2" data="${3:-}" try out
          for try in 1 2 3; do
            if [ -n "$data" ]; then
              # JSON gre na curl v STDIN, ne v argv: MSYS (Git Bash) argv pri
              # predaji nativnemu curl.exe pretvori v OEM kodno stran, zato
              # UTF-8 (š, č, —) razpade v '?' — izmerjeno 22. 10. V naslovu in
              # bodyju alarmne issue bi ostali grbi; bajti prek cevi preživijo
              # na obeh OS. Poleg tega predolgim body-jem ne more zmanjkati
              # prostora v ukazni vrstici.
              out=$(printf '%s' "$data" | curl -sS -f -X "$method" "$API$ep" \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                --data-binary @- 2>/dev/null) || out=''
            else
              out=$(curl -sS -f -X "$method" "$API$ep" \
                -H "Authorization: Bearer $TOKEN" 2>/dev/null) || out=''
            fi
            [ -n "$out" ] && { echo "$out"; return 0; }
            sleep $((try * SLEEP))
          done
          echo "::warning::api $method $ep ni uspel v 3 poskusih" >&2
          return 1
        }

        # 1) label (idempotentno: 422 pri že obstajočem ignoriramo)
        api POST "/labels" '{"name":"ci-alarm","color":"E11D48","description":"CI job je odpovedal - potreben razlog"}' >/dev/null \
          || api GET "/labels/ci-alarm" >/dev/null || true

        # 2) ze odprt issue s tem naslovom?
        NUM=$(api GET "/issues?state=open&labels=ci-alarm&per_page=100" | node -e "let s = ''; process.stdin.on('data', (d) => s += d); process.stdin.on('end', () => { try { const want = (process.argv[1] || '').toLowerCase(); for (const it of JSON.parse(s)) { if ((it.title || '').toLowerCase() === want) { console.log(it.number); break } } } catch (e) {} })" "$TITLE" || true)

        if [ -n "$NUM" ]; then
          COMMENT=":repeat: nova odpoved istega joba — run [#$GITHUB_RUN_NUMBER]($SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) \`$GITHUB_SHA\` (${GITHUB_RUN_ATTEMPT:-1}. poskus)"
          if api POST "/issues/$NUM/comments" "$(node -e "process.stdout.write(JSON.stringify({ body: process.argv[1] }))" "$COMMENT")"; then
            echo "state=dopolnjena" >> "$GITHUB_OUTPUT"
            echo "Obstoječ issue #${NUM} dopolnjen z novo odpovedjo."
            exit 0
          fi
        fi

        # 3) nov issue
        NEW=$(api POST "/issues" "$(node -e "process.stdout.write(JSON.stringify({ title: process.argv[1], body: process.argv[2], labels: ['ci-alarm'] }))" "$TITLE" "$BODY")" | node -e "let s = ''; process.stdin.on('data', (d) => s += d); process.stdin.on('end', () => { try { const n = JSON.parse(s).number; if (n !== undefined) console.log(n) } catch (e) {} })" || true)

        if [ -z "$NEW" ]; then
          echo "state=spodletela" >> "$GITHUB_OUTPUT"
          echo "::warning::alarm issue ni bil ustvarjen (API/GITHUB_TOKEN) — preveri run rocno"
          exit 0
        fi
        echo "state=odprta" >> "$GITHUB_OUTPUT"
        echo "Ustvarjen issue #${NEW}: ${TITLE}"

        # 4) dodelitev = pravi signal (e-pošta/GitHub obvestilo lastniku).
        #    Ce pade (npr. lastnik ni sodelavec), issue ostane — zato || true.
        OWNER="${GITHUB_REPOSITORY_OWNER:-$GITHUB_ACTOR}"
        api POST "/issues/$NEW/assignees" "$(node -e "process.stdout.write(JSON.stringify({ assignees: [process.argv[1]] }))" "$OWNER")" >/dev/null \
          || echo "::warning::issue #${NEW} ni bil dodeljen ($OWNER) — alarm je vseeno odprt"

    - name: 'Ce API ni dostopen, vsaj izpisati navodilo'
      shell: bash
      if: steps.alarm.outputs.state == 'spodletela'
      run: |
        echo "Rocni pregled: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "Ustvari issue rocno z labelom ci-alarm, da ostane sled."
