# RestaurantOS — GitLab CI (issue #4 §12 + issue #10 P2-2)
#
# Pipeline: verify on branch pushes/MRs/schedules; build only when DATABASE_URL exists.
#
# DATABASE_URL (optional for production build):
# GitLab → Settings → CI/CD → Variables → add masked/protected DATABASE_URL.
#
# Usklajeno z GitHub Actions (audit okt-2026 #15, sinhronizacija treh sistemov):
# quality-gate = isti recept kot `tests` job v .github/workflows/ci.yml,
# production-build = isti proračun kot `typecheck-prod` + build. Kjer se dva
# sistema razhajata, zelen pomeni nič — zato je recept zapisan z isto vsebino
# in z isto vrstico komentarja na obeh straneh.

image: oven/bun:1

stages:
  - verify
  - build

quality-gate:
  stage: verify
  rules:
    # Run on merge requests and pushes to main.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    # Popravek neskladja (oct-2026): brez DATABASE_URL je bil ta gate čuden —
    # scripts/prisma-postinstall.cjs brez `file:` URL-ja izbere PRODUKCIJSKI
    # (Postgres) klient, testi pa odpirajo svežo SQLite bazo. Brez `db push`
    # baza sploh ni obstajala, zato je `bun run test` tolkel ali po infrastrukturi
    # ali po napačnih tipih — nikoli ne po kodi, kar je namen gate-a.
    DATABASE_URL: file:./db/ci-gitlab.db
  cache:
    key:
      files:
        - package.json
      # Ločen predpomnik po jobu: production-build generira Postgres klient v
      # node_modules/.prisma; če bi si joba delila isti predpomnik, bi naslednji
      # quality-gate dobil klient, ki ne ustreza njegovemu `file:` URL-ju.
      prefix: quality-gate
    paths:
      - node_modules/
  script:
    - bun install --frozen-lockfile
    # №25 (audit okt-2026): slika `oven/bun:1` `git`-a NIMA. Skupina B2 v
    # tests/audit1516-ci-hygiene.test.ts ga potrebuje (prava bare repozitorija za
    # sync guard), zato ga poskušamo namestiti. POSKUS JE NAMERNO TAK, DA NE MORE
    # PODRETI JOBA: job ne sme biti rdeč zaradi manjkajočega orodja, sicer
    # ponavljamo napako №23 (gate, ki umre zaradi infrastrukture in ne pove
    # ničesar o kodi). Če namestitev ne uspe, se skupina B2 preskoči in to je v
    # logu zapisano z oznako PRESKOCENO-B2; na GitHub Actions se vedno izvede
    # (tam runner ima git).
    - bash -c 'command -v git >/dev/null 2>&1 || { apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq --no-install-recommends git >/dev/null 2>&1; } || echo "GIT-MISSING — B2 skupina (sync guard) bo preskočena"'
    # sveža SQLite baza (isti korak kot ci.yml:182) — WITHOUT this the suite is not equivalent
    - bunx prisma db push --schema prisma/schema.sqlite.prisma --skip-generate
    # №26 (audit okt-2026): vrstni red je OBRNJEN glede na prejšnjega. Dotlej sta
    # bila `check-schema-drift.cjs` in `check-secrets.sh` zadnja koraka za
    # `bun run test`, job pa se ustavi ob prvi napaki (GitLab vsako vrstico
    # `script`-a izvede pod `set -e`). Kakršen koli rdeč test ju zato ni nikoli
    # pognal — v pipeline #57 NISTA tekla, čeprav se je testni del zaključil
    # (9 padlih testov). Posledica ni neurejenost, ampak NEVIDEN izpuščen žeton
    # ali drift sheme: varnostni gate, ki je odvisen od tega, da je vse ostalo
    # zeleno, ni varnostni gate.
    # Zdaj gresta DVA hitra, neodvisna pregleda PRED drago gradnjo.
    - node scripts/check-schema-drift.cjs
    - bash scripts/check-secrets.sh
    - bunx tsc --noEmit
    - bun run lint
    # isti proračun hookov kot lokalno in na GitHub Actions (v1.148.0) —
    # en sam vir v package.json, da se three-way CI ne razhaja.
    #
    # OMEJITEV, KI JO JE ZABILA NAJDBA №23 (v1.151.0): omejitev jobskega loga
    # na GitLabu je 4.194.304 B. Z privzetim Prisma query logom je celoten
    # suite natisnil 17.044.192 B (59.255 `prisma:query` vrstic), job je umrl
    # sredi testov in oba zadnja koraka (drift + secrets) se NISTA izvedla —
    # rdeč izid brez razloga. Zato `src/lib/db.ts` logira poizvedbe samo, če je
    # PRISMA_LOG_QUERIES=1, in ga TU NE prizegamo (pinirano v
    # tests/audit2324-log-noise.test.ts, skupina A). Meritev po popravku: log
    # pipeline #57 je bil 653.068 B — omejitev ni več ozko grlo.
    - bun run test

# Production build is optional and only runs when DATABASE_URL is configured.
# Z `ignoreBuildErrors` odstranjenim (oct-2026 #18) je to hkrati edini typecheck
# proti PRODUKCIJSKEMU klientu na GitLabu — ustreza `typecheck-prod` jobu na
# GitHub Actions. Brez nastavljene spremenljivke se job preskoči, zato je
# poskrbeti zanje tu ALI se zanašati na typecheck-prod na GitHubu (garantirano).
production-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DATABASE_URL'
  cache:
    key:
      files:
        - package.json
      prefix: production-build
    paths:
      - node_modules/
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate --schema prisma/schema.prisma
    - bun run build
